name: Tectonic Drift Detection
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LENS_ENABLED: true
      LENS_SWARM_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install JS dependencies (if a manifest exists)
        run: |
          if [ -f package.json ] || [ -f bun.lockb ]; then
            bun install --no-save || npm install
          else
            echo no package.json slash bun.lockb - stdlib-only, skipping install
          fi
      - name: Analyze drift
        run: |
          cat > drift-analyze.cjs <<'EOF'
          const { LensOrchestrator } = require('./lib/lens-orchestrator');
          const orch = new LensOrchestrator({ lensDir: require('path').resolve('./src/_11ty/lenses') });
          orch.discover().then(() => {
            return orch.analyze('tectonic', {}, { lastPush: new Date().toISOString(), repo: 'effusion-labs', ciMode: true });
          }).then(r => {
            console.log('Health Score:', r.healthScore);
            console.log('Drift Count:', r.driftCount);
            console.log('CI Threshold:', r.ciThreshold || 50);
            const threshold = r.ciThreshold || 50;
            if (r.healthScore < threshold) {
              console.error('WARNING: Health score ' + r.healthScore + ' below threshold ' + threshold);
              process.exit(1);
            }
          }).catch(e => { console.error(e); process.exit(1); });
          EOF
          node drift-analyze.cjs
          rm -f drift-analyze.cjs
