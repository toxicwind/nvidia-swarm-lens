name: ARC-AGI Swarm CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp requests python-dotenv
      - run: python -m py_compile src/nvidia_swarm/*.py
      - run: python -m py_compile src/iptv_discovery/*.py
      - run: python -m py_compile src/benchmarks/*.py

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp requests
      - run: python src/benchmarks/runner.py || true
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: data/benchmarks/latest.json
