name: ARC-AGI Swarm CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp requests python-dotenv
      - name: Compile all first-party Python
        run: |
          python - <<'PYEOF_INNER'
          import compileall, re, sys
          ok = compileall.compile_dir(
              '.',
              rx=re.compile(r'[/\\](bin/pylibs|node_modules|\.git|__pycache__)([/\\]|$)'),
              quiet=1,
          )
          sys.exit(0 if ok else 1)
          PYEOF_INNER

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp requests
      - run: python src/benchmarks/runner.py || true
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: data/benchmarks/latest.json
